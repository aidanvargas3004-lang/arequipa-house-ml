# Entorno local con PostgreSQL:  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: arequipa
      POSTGRES_PASSWORD: arequipa_pass
      POSTGRES_DB: arequipa_house
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arequipa -d arequipa_house"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      APP_ENV: production
      SECRET_KEY: cambia-esto-en-serio
      DATABASE_URL: postgresql://arequipa:arequipa_pass@db:5432/arequipa_house
      ADMIN_EMAIL: admin@arequipahouse.pe
      ADMIN_PASSWORD: Admin12345
      SEED_DEMO: "1"
      AUTO_BOOTSTRAP: "0"
      COOKIE_SECURE: "0"   # se sirve por http://localhost; en producción real (HTTPS) déjalo en 1
    ports: ["8000:8000"]
    volumes: ["media:/app/instance"]

volumes:
  pgdata:
  media:
