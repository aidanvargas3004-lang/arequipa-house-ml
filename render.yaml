# Despliegue en Render (Blueprint): https://render.com/docs/blueprint-spec
services:
  - type: web
    name: arequipa-house-ml
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # bootstrap es idempotente: crea tablas, administrador, dataset y modelo inicial solo si faltan
    startCommand: flask --app wsgi bootstrap && gunicorn wsgi:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: AUTO_BOOTSTRAP
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: arequipa-house-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@arequipahouse.pe
      - key: ADMIN_PASSWORD
        sync: false          # defínela en el panel de Render
      - key: SEED_DEMO
        value: "0"           # pon "1" solo para una demostración con datos de ejemplo

databases:
  - name: arequipa-house-db
    plan: free
    databaseName: arequipa_house
    user: arequipa
